name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - run: npm install
      - run: npx c8 -r lcov -r text --all --include='app/**/*.js' node --test test/*.test.js
      - uses: codecov/codecov-action@v5
        with:
          flags: js
          token: ${{ secrets.CODECOV_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/*.py eval/diarization/*.py   # rule selection/ignores come from pyproject.toml
      - name: syntax-check every .py file
        run: |
          for f in app/*.py eval/diarization/*.py; do python3 -m py_compile "$f" || exit 1; done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n launch.command stop.command && shellcheck -S warning launch.command stop.command

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no private/case terms committed
        run: |
          # Excludes: this workflow file (contains the search terms themselves), LICENSE (the
          # repo owner's own name in the copyright line is expected in every public repo under
          # their account, same as README/package author fields elsewhere), and the test suite
          # (asserts the ABSENCE of these terms in a rendered prompt via doesNotMatch -- the
          # terms appear in the test's own source as a negative-match regex, not as content).
          EXCLUDE=(':!.github/workflows/ci.yml' ':!LICENSE' ':!test/**')
          PATTERN='amur|old gold|christopher queen|michael williams|karla beran|umb bank|navitas|norton|aragona'
          if git grep -qriE "$PATTERN" -- . "${EXCLUDE[@]}"; then
            echo "Found a private-term match -- see CONTRIBUTING.md."
            git grep -riE "$PATTERN" -- . "${EXCLUDE[@]}"
            exit 1
          fi
          echo "clean"
