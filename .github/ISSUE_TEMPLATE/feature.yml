name: Feature request
description: Propose a change to Hearing Copilot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem this solves?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Does this belong here, or in copilot-core?
      options:
        - label: App-specific (rebuttal matching, the binder viewer, courtroom speaker-ID policy, hearing-profile schema)
        - label: Shared machinery that tech-interview-copilot could also use (file an issue on copilot-core instead)
